excerpt: A new tasting built around native maize from small Oaxacan growers, milled each morning at Molino “El Pujol”.
excerptEs: Un nuevo menú degustación en torno al maíz nativo de pequeños productores oaxaqueños, molido cada mañana en Molino “El Pujol”.
body: |
  Pujol refreshes its seasonal menu with a tasting built around native maize from small Oaxacan growers.

  The new sequence begins at Molino "El Pujol", where corn is milled each morning before moving into the restaurant's kitchen and dining room.
bodyEs: |
  Pujol renueva su menú de temporada con una degustación construida alrededor del maíz nativo de pequeños productores oaxaqueños.

  La nueva secuencia comienza en Molino "El Pujol", donde el maíz se muele cada mañana antes de pasar a la cocina y al comedor del restaurante.
