excerpt: A seasonal program pairing Atla's kitchen with artists working across print, installation and tableside pieces.
excerptEs: Un programa de temporada que une la cocina de Atla con artistas que trabajan en gráfica, instalación y piezas para la mesa.
body: |
  Atla introduces a seasonal collaboration with visual artists working across print, installation and table objects.

  The program extends the restaurant's daily rhythm into a small editorial frame, pairing food, service and image-making through a rotating group of local voices.
bodyEs: |
  Atla presenta una colaboración de temporada con artistas visuales que trabajan en gráfica, instalación y objetos de mesa.

  El programa lleva el ritmo cotidiano del restaurante a un pequeño marco editorial, uniendo comida, servicio e imagen a través de un grupo rotativo de voces locales.
