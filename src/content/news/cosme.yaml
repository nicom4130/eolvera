body: |
  Cosme marks ten years in Manhattan with a limited anniversary menu that revisits signatures from the restaurant's first decade.

  The menu looks back at New York sourcing, Mexican technique and the dining room language that has shaped Cosme since opening.
bodyEs: |
  Cosme celebra diez años en Manhattan con un menú aniversario por tiempo limitado que revisita platos emblemáticos de su primera década.

  El menú mira hacia el producto de Nueva York, la técnica mexicana y el lenguaje de sala que ha definido a Cosme desde su apertura.
