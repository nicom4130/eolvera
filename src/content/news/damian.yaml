excerpt: A look at Damian's Los Angeles evolution, from masa and seafood to a sharper California-Mexican point of view.
body: |
  Damian continues to evolve its Los Angeles point of view through masa, seafood and produce from California.

  The restaurant's latest recognition reflects a sharper dialogue between Mexican cooking and the city around it.
