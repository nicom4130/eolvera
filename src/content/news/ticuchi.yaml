body: |
  Ticuchi launches a new mezcal list focused on independent producers from Oaxaca.

  The selection expands the bar's role as a quiet meeting point for agave, antojitos and late-night service in Mexico City.
bodyEs: |
  Ticuchi estrena una carta de mezcales enfocada en productores independientes de Oaxaca.

  La selección amplía el papel del bar como un punto de encuentro discreto para agave, antojitos y servicio nocturno en la Ciudad de México.
